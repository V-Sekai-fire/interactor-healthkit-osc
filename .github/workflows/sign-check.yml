name: Build and sign check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign:
    runs-on: macos-latest
    steps:
      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install xtool
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xtool.zip" https://github.com/xtool-org/xtool/releases/download/1.24.0/xtool.app.zip
          unzip -q "$RUNNER_TEMP/xtool.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xtool.app/Contents/Resources/bin" >> "$GITHUB_PATH"

      - name: Log in with the App Store Connect key
        timeout-minutes: 3
        env:
          KEY_ID: ${{ secrets.APPLE_SIGN_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_SIGN_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPLE_SIGN_KEY_P8 }}
        run: |
          set -eu
          umask 077
          printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/key.p8"
          xtool --version
          ( sleep 3; printf '%s\n' "$KEY_ID"; sleep 2; printf '%s\n' "$ISSUER_ID"; sleep 2; printf '%s\n' "$RUNNER_TEMP/key.p8"; sleep 10 ) \
            | script -q /dev/null xtool auth login --mode key
          rm -f "$RUNNER_TEMP/key.p8"
          xtool auth status

      - name: Delete stale development certificates
        timeout-minutes: 3
        env:
          KEY_ID: ${{ secrets.APPLE_SIGN_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_SIGN_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPLE_SIGN_KEY_P8 }}
        run: |
          set -eu
          umask 077
          printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/key.p8"
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now=$(date +%s)
          header=$(printf '{"alg":"ES256","kid":"%s","typ":"JWT"}' "$KEY_ID" | b64)
          payload=$(printf '{"iss":"%s","iat":%s,"exp":%s,"aud":"appstoreconnect-v1"}' "$ISSUER_ID" "$now" "$((now + 600))" | b64)
          printf '%s.%s' "$header" "$payload" > "$RUNNER_TEMP/signing-input"
          openssl dgst -sha256 -sign "$RUNNER_TEMP/key.p8" -out "$RUNNER_TEMP/sig.der" "$RUNNER_TEMP/signing-input"
          sig=$(python3 - "$RUNNER_TEMP/sig.der" <<'PY' | b64
          import sys
          d = open(sys.argv[1], 'rb').read()
          i = 2 + (d[1] & 0x7F if d[1] & 0x80 else 0)
          def take(i):
              n = d[i + 1]
              v = d[i + 2:i + 2 + n]
              return v.lstrip(b'\0').rjust(32, b'\0'), i + 2 + n
          r, i = take(i)
          s, i = take(i)
          sys.stdout.buffer.write(r + s)
          PY
          )
          jwt="$(cat "$RUNNER_TEMP/signing-input").$sig"
          rm -f "$RUNNER_TEMP/key.p8" "$RUNNER_TEMP/sig.der" "$RUNNER_TEMP/signing-input"
          # Apple allows one development certificate, and a CI run's private key dies with the runner.
          # Only development certificates are listed; Developer ID certificates are never touched.
          curl -fsS -H "Authorization: Bearer $jwt" \
            "https://api.appstoreconnect.apple.com/v1/certificates?filter%5BcertificateType%5D=DEVELOPMENT,IOS_DEVELOPMENT&limit=200" \
            -o "$RUNNER_TEMP/certs.json"
          ids=$(python3 -c "import json,sys; print(*[c['id'] for c in json.load(open(sys.argv[1]))['data']])" "$RUNNER_TEMP/certs.json")
          echo "development certificates found: $(echo $ids | wc -w | tr -d ' ')"
          for id in $ids; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $jwt" "https://api.appstoreconnect.apple.com/v1/certificates/$id")
            echo "revoke -> HTTP $code"
          done
          rm -f "$RUNNER_TEMP/certs.json"

      - name: Make and sign a hello-world app
        timeout-minutes: 15
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          xtool new Hello
          cd Hello
          sed -i '' 's/com\.example\.Hello/com.chibifire.hellosigncheck/' xtool.yml
          cat xtool.yml
          cat > App.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.developer.healthkit</key>
              <true/>
          </dict>
          </plist>
          PLIST
          echo 'entitlementsPath: App.entitlements' >> xtool.yml
          cat xtool.yml
          xtool dev build --sign
          APP=$(find . -name '*.app' -maxdepth 4 | head -n 1)
          echo "app: $APP"
          codesign -d --entitlements - "$APP" 2>&1 | grep -a -A1 "healthkit"
          security cms -D -i "$APP/embedded.mobileprovision" | grep -a -A1 "healthkit"
