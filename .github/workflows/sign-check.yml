name: Build and sign check

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  sign:
    runs-on: macos-latest
    steps:
      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install xtool
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xtool.zip" https://github.com/xtool-org/xtool/releases/download/1.24.0/xtool.app.zip
          unzip -q "$RUNNER_TEMP/xtool.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xtool.app/Contents/Resources/bin" >> "$GITHUB_PATH"

      - name: Log in with the App Store Connect key
        timeout-minutes: 3
        env:
          KEY_ID: ${{ secrets.APPLE_SIGN_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_SIGN_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPLE_SIGN_KEY_P8 }}
        run: |
          set -eu
          umask 077
          printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/key.p8"
          xtool --version
          ( sleep 3; printf '%s\n' "$KEY_ID"; sleep 2; printf '%s\n' "$ISSUER_ID"; sleep 2; printf '%s\n' "$RUNNER_TEMP/key.p8"; sleep 10 ) \
            | script -q /dev/null xtool auth login --mode key
          rm -f "$RUNNER_TEMP/key.p8"
          xtool auth status

      - name: Restore the saved signing identity
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: ${{ secrets.APPLE_SIGN_CACHE_KEY }}
        run: |
          set -u
          DATA="$(dirname "$(find "$HOME" -name XTLAuthToken -print -quit 2>/dev/null)")"
          echo "xtool data dir: $DATA"
          echo "XTOOL_DATA=$DATA" >> "$GITHUB_ENV"
          ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=xtool-signing-identity&per_page=1" --jq '.artifacts[] | select(.expired==false) | .id' | head -n 1)
          if [ -z "$ID" ]; then echo "no saved identity; a new development certificate will be made"; exit 0; fi
          gh api "repos/${{ github.repository }}/actions/artifacts/$ID/zip" > "$RUNNER_TEMP/id.zip"
          unzip -q -o "$RUNNER_TEMP/id.zip" -d "$RUNNER_TEMP/id"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:CACHE_KEY -in "$RUNNER_TEMP/id/identity.enc" | tar -xz -C "$DATA"
          echo "restored files: $(ls "$DATA" | wc -l)"

      - name: Make and sign a hello-world app
        timeout-minutes: 15
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          xtool new Hello
          cd Hello
          sed -i '' 's/com\.example\.Hello/com.chibifire.hellosigncheck/' xtool.yml
          cat xtool.yml
          cat > App.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.developer.healthkit</key>
              <true/>
          </dict>
          </plist>
          PLIST
          echo 'entitlementsPath: App.entitlements' >> xtool.yml
          cat xtool.yml
          xtool dev build --sign
          APP=$(find . -name '*.app' -maxdepth 4 | head -n 1)
          echo "app: $APP"
          codesign -d --entitlements - "$APP" 2>&1 | grep -a -A1 "healthkit"
          security cms -D -i "$APP/embedded.mobileprovision" | grep -a -A1 "healthkit"

      - name: Save the signing identity, encrypted
        if: always()
        env:
          CACHE_KEY: ${{ secrets.APPLE_SIGN_CACHE_KEY }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/out"
          ls "$XTOOL_DATA"
          tar -czf - -C "$XTOOL_DATA" --exclude XTLAuthToken . \
            | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:CACHE_KEY -out "$RUNNER_TEMP/out/identity.enc"
          ls -l "$RUNNER_TEMP/out/identity.enc"

      - name: Upload the encrypted identity
        uses: actions/upload-artifact@v7.0.2
        with:
          name: xtool-signing-identity
          path: ${{ runner.temp }}/out/identity.enc
          retention-days: 90
          overwrite: true
