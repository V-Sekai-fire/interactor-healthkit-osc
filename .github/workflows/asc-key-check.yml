name: ASC key check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the App Store Connect API what the key can read
        env:
          KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
        run: |
          set -eu
          umask 077
          printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/key.p8"
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now=$(date +%s)
          header=$(printf '{"alg":"ES256","kid":"%s","typ":"JWT"}' "$KEY_ID" | b64)
          payload=$(printf '{"iss":"%s","iat":%s,"exp":%s,"aud":"appstoreconnect-v1"}' "$ISSUER_ID" "$now" "$((now + 600))" | b64)
          printf '%s.%s' "$header" "$payload" > "$RUNNER_TEMP/signing-input"
          openssl dgst -sha256 -sign "$RUNNER_TEMP/key.p8" -out "$RUNNER_TEMP/sig.der" "$RUNNER_TEMP/signing-input"
          sig=$(python3 - "$RUNNER_TEMP/sig.der" <<'PY' | b64
          import sys
          d = open(sys.argv[1], 'rb').read()
          i = 2 + (d[1] & 0x7F if d[1] & 0x80 else 0)
          def take(i):
              n = d[i + 1]
              v = d[i + 2:i + 2 + n]
              return v.lstrip(b'\0').rjust(32, b'\0'), i + 2 + n
          r, i = take(i)
          s, i = take(i)
          sys.stdout.buffer.write(r + s)
          PY
          )
          jwt="$(cat "$RUNNER_TEMP/signing-input").$sig"
          rm -f "$RUNNER_TEMP/key.p8" "$RUNNER_TEMP/sig.der" "$RUNNER_TEMP/signing-input"
          for path in "v1/certificates?limit=1" "v1/bundleIds?limit=1" "v1/devices?limit=1" "v1/profiles?limit=1"; do
            code=$(curl -s -o "$RUNNER_TEMP/body.json" -w '%{http_code}' -H "Authorization: Bearer $jwt" "https://api.appstoreconnect.apple.com/$path")
            echo "GET /$path -> HTTP $code"
            if [ "$code" != 200 ]; then python3 -c "import json,sys; [print('  ', e.get('code'), e.get('title')) for e in json.load(open(sys.argv[1])).get('errors', [])]" "$RUNNER_TEMP/body.json" || true; fi
          done
