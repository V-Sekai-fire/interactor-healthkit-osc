name: Build the signed IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Test the OSC encoder
        run: |
          set -eu
          cc -Wall -Wextra -Werror -std=c11 -D_POSIX_C_SOURCE=200809L -ISources/OSC/include Sources/OSC/osc.c tests/osc_test.c -o "$RUNNER_TEMP/osc_test"
          python3 tests/check.py "$RUNNER_TEMP/osc_test"

      - name: Install xtool
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xtool.zip" https://github.com/xtool-org/xtool/releases/download/1.24.0/xtool.app.zip
          unzip -q "$RUNNER_TEMP/xtool.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xtool.app/Contents/Resources/bin" >> "$GITHUB_PATH"

      - name: Make an App Store Connect token
        id: token
        timeout-minutes: 2
        env:
          KEY_ID: ${{ secrets.APPLE_SIGN_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_SIGN_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPLE_SIGN_KEY_P8 }}
        run: |
          set -eu
          umask 077
          printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/key.p8"
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now=$(date +%s)
          header=$(printf '{"alg":"ES256","kid":"%s","typ":"JWT"}' "$KEY_ID" | b64)
          payload=$(printf '{"iss":"%s","iat":%s,"exp":%s,"aud":"appstoreconnect-v1"}' "$ISSUER_ID" "$now" "$((now + 600))" | b64)
          printf '%s.%s' "$header" "$payload" > "$RUNNER_TEMP/signing-input"
          openssl dgst -sha256 -sign "$RUNNER_TEMP/key.p8" -out "$RUNNER_TEMP/sig.der" "$RUNNER_TEMP/signing-input"
          sig=$(python3 - "$RUNNER_TEMP/sig.der" <<'PY' | b64
          import sys
          d = open(sys.argv[1], 'rb').read()
          i = 2 + (d[1] & 0x7F if d[1] & 0x80 else 0)
          def take(i):
              n = d[i + 1]
              v = d[i + 2:i + 2 + n]
              return v.lstrip(b'\0').rjust(32, b'\0'), i + 2 + n
          r, i = take(i)
          s, i = take(i)
          sys.stdout.buffer.write(r + s)
          PY
          )
          jwt="$(cat "$RUNNER_TEMP/signing-input").$sig"
          echo "::add-mask::$jwt"
          echo "jwt=$jwt" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/key.p8" "$RUNNER_TEMP/sig.der" "$RUNNER_TEMP/signing-input"

      - name: Revoke stale development certificates and register the phone
        timeout-minutes: 3
        env:
          JWT: ${{ steps.token.outputs.jwt }}
          UDID: ${{ secrets.APPLE_DEVICE_UDID }}
        run: |
          set -eu
          # Apple allows one development certificate and this runner's key dies with it, so clear the old one.
          # Only development certificates are listed; Developer ID certificates are never touched.
          curl -fsS -H "Authorization: Bearer $JWT" \
            "https://api.appstoreconnect.apple.com/v1/certificates?filter%5BcertificateType%5D=DEVELOPMENT,IOS_DEVELOPMENT&limit=200" \
            -o "$RUNNER_TEMP/certs.json"
          for id in $(python3 -c "import json,sys; print(*[c['id'] for c in json.load(open(sys.argv[1]))['data']])" "$RUNNER_TEMP/certs.json"); do
            echo "revoke -> HTTP $(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $JWT" "https://api.appstoreconnect.apple.com/v1/certificates/$id")"
          done
          body=$(python3 -c "import json,os; print(json.dumps({'data':{'type':'devices','attributes':{'name':'iPhone','platform':'IOS','udid':os.environ['UDID']}}}))")
          code=$(curl -s -o "$RUNNER_TEMP/dev.json" -w '%{http_code}' -X POST -H "Authorization: Bearer $JWT" -H 'Content-Type: application/json' -d "$body" https://api.appstoreconnect.apple.com/v1/devices)
          echo "register phone -> HTTP $code (409 means it is already registered)"
          rm -f "$RUNNER_TEMP/certs.json" "$RUNNER_TEMP/dev.json"

      - name: Log in to xtool
        timeout-minutes: 3
        env:
          KEY_ID: ${{ secrets.APPLE_SIGN_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_SIGN_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPLE_SIGN_KEY_P8 }}
        run: |
          set -eu
          umask 077
          printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/key.p8"
          ( sleep 3; printf '%s\n' "$KEY_ID"; sleep 2; printf '%s\n' "$ISSUER_ID"; sleep 2; printf '%s\n' "$RUNNER_TEMP/key.p8"; sleep 10 ) \
            | script -q /dev/null xtool auth login --mode key
          rm -f "$RUNNER_TEMP/key.p8"

      - name: Build and sign the IPA
        timeout-minutes: 20
        env:
          UDID: ${{ secrets.APPLE_DEVICE_UDID }}
        run: |
          set -eu
          xtool dev build --sign --ipa
          IPA=$(find . -name '*.ipa' -maxdepth 3 | head -n 1)
          echo "ipa: $IPA"
          unzip -q -o "$IPA" -d "$RUNNER_TEMP/ipa"
          APP=$(find "$RUNNER_TEMP/ipa/Payload" -name '*.app' -maxdepth 1)
          codesign -d --entitlements - "$APP" 2>&1 | grep -a "healthkit" | head -2
          security cms -D -i "$APP/embedded.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          if grep -aq "$UDID" "$RUNNER_TEMP/profile.plist"; then echo "profile lists the registered phone: yes"; else echo "profile lists the registered phone: NO"; exit 1; fi
          rm -rf "$RUNNER_TEMP/ipa" "$RUNNER_TEMP/profile.plist"
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"

      - name: Encrypt the IPA
        env:
          CACHE_KEY: ${{ secrets.APPLE_SIGN_CACHE_KEY }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/out"
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:CACHE_KEY -in "$IPA_PATH" -out "$RUNNER_TEMP/out/HeartRateOSC.ipa.enc"
          ls -l "$RUNNER_TEMP/out/HeartRateOSC.ipa.enc"

      - name: Keep the encrypted IPA for a day
        uses: actions/upload-artifact@v7.0.2
        with:
          name: heartrateosc-ipa-encrypted
          path: ${{ runner.temp }}/out/HeartRateOSC.ipa.enc
          retention-days: 1
          overwrite: true
